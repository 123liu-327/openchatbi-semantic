version: 1
levels:
  原子指标: atomic
  派生指标: derived
  复合指标: composite
metric_names:
  收入: revenue
  销售成本: cogs
  毛利: gross_profit
  毛利率: gross_margin_rate
  期间费用: total_expense
  利润: profit
  客单价: avg_order_value
  订单量: order_count
  研发费用率: rd_expense_ratio
  销售费用率: selling_expense_ratio
  产品线收入: product_line_revenue
  区域收入: region_revenue
  销量: total_quantity
multi_step_metrics: [利润, 研发费用率, 销售费用率]
rule_names:
  - revenue_requires_net_amount
  - revenue_forbids_gross_amount
  - tax_inclusive_requires_gross_amount
  - tax_inclusive_forbids_net_amount
  - cost_requires_material_and_labor
  - completed_order_filter
  - currency_conversion_fields
  - expense_subtotal_exclusion
include_tables: [dim_customers, dim_products, exchange_rates, finance_expenses, sales_orders]
exclude_tables: [hr_attendance_records, iot_device_alerts, legal_contract_archive, warehouse_temperature_logs]
metric_columns:
  - dim_products.standard_cost
  - dim_products.material_cost
  - dim_products.labor_cost
  - exchange_rates.rate_to_cny
  - finance_expenses.rd_expense
  - finance_expenses.selling_expense
  - finance_expenses.admin_expense
  - finance_expenses.finance_expense
  - finance_expenses.marketing_expense
  - finance_expenses.logistics_expense
  - finance_expenses.warranty_expense
  - sales_orders.quantity
  - sales_orders.unit_price
  - sales_orders.discount_amount
  - sales_orders.gross_amount
  - sales_orders.net_amount
review_notes:
  - T6 通过 exclude_any 显式表达原注释中的含税例外；成本规则按来源指标 notes 硬排除 standard_cost。
  - 数据源含 SQL JOIN 和加号两种结构；迁移只拆解显式表名，不改写计算口径。
  - 多步指标的原始公式、步骤和复合时间字段保留在迁移报告 conversions 中，运行时依赖 requires_multi_step。
rule_overrides:
  revenue_requires_net_amount:
    exclude_any: [含税, tax-inclusive, tax inclusive, including tax, gross revenue]
    trigger_any: [收入, 销售额, 营业收入, 营收, revenue, income]
  revenue_forbids_gross_amount:
    exclude_any: [含税, tax-inclusive, tax inclusive, including tax, gross revenue]
    trigger_any: [收入, 销售额, 营业收入, 营收, 成本, 毛利, 利润, revenue, income, cost, profit, margin]
  tax_inclusive_requires_gross_amount:
    trigger_any: [含税, 含税金额, 含税收入, tax-inclusive, tax inclusive, including tax, gross revenue]
  tax_inclusive_forbids_net_amount:
    trigger_any: [含税, 含税金额, 含税收入, tax-inclusive, tax inclusive, including tax, gross revenue]
  cost_requires_material_and_labor:
    forbid_columns: [dim_products.standard_cost]
    trigger_any: [成本, 毛利, 利润, cost, profit, margin]
  completed_order_filter:
    trigger_any: [收入, 销售额, 订单量, 订单数, 客单价, revenue, income, order count, average order value]
  currency_conversion_fields:
    trigger_any: [人民币, 汇率, 换算, 折算, 统一币种, currency, exchange rate, conversion]
  expense_subtotal_exclusion:
    trigger_any: [总费用, 期间费用合计, 费用汇总, total expenses, operating expenses]
metric_aliases:
  revenue: [income, sales revenue, net sales]
  cogs: [cost, cost of goods sold, sales cost]
  gross_profit: [gross profit]
  gross_margin_rate: [gross margin rate, gross margin percentage]
  total_expense: [total expenses, operating expenses]
  profit: [operating profit, net profit]
  avg_order_value: [average order value]
  order_count: [order count, number of orders]
  rd_expense_ratio: [R&D expense ratio]
  selling_expense_ratio: [selling expense ratio]
  product_line_revenue: [revenue by product line]
  region_revenue: [revenue by region]
  total_quantity: [quantity sold, sales volume]
