version: 1
metrics:
- name: revenue
  label: 收入
  aliases:
  - 收入
  - 销售额
  - 营收
  - 销售收入
  - 营业收入
  - 总收入
  level: atomic
  definition: '不含税销售收入，财务口径的销售额。统一使用 net_amount 字段，按订单日期的汇率折算为人民币。只统计已完成（completed）订单。

    注意：gross_amount 是含税金额，除非明确要求含税否则不使用'
  sql_template: SELECT SUM(o.net_amount * r.rate_to_cny) AS revenue FROM sales_orders o JOIN exchange_rates r ON
    o.order_date = r.rate_date AND o.currency = r.currency WHERE o.order_status = 'completed'
  depends_on: []
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#收入
- name: cogs
  label: 销售成本
  aliases:
  - 销售成本
  - 成本
  - COGS
  - 产品成本
  level: atomic
  definition: '已售产品的实际成本，等于（材料成本 + 人工成本）× 数量。只统计已完成订单。

    standard_cost 包含制造费用分摊，毛利计算统一使用 material_cost + labor_cost'
  sql_template: SELECT SUM((p.material_cost + p.labor_cost) * o.quantity) AS cost FROM sales_orders o JOIN dim_products
    p ON o.product_id = p.product_id WHERE o.order_status = 'completed'
  depends_on: []
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - dim_products
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#销售成本
- name: gross_profit
  label: 毛利
  aliases:
  - 毛利
  - 毛利润
  - gross_profit
  - 销售毛利
  level: derived
  definition: '销售收入减去销售成本。反映产品本身的盈利能力。

    毛利 = 收入 - 成本，是利润计算的中间结果'
  sql_template: SELECT SUM(o.net_amount * r.rate_to_cny) - SUM((p.material_cost + p.labor_cost) * o.quantity) AS
    gross_profit FROM sales_orders o JOIN dim_products p ON o.product_id = p.product_id JOIN exchange_rates r ON
    o.order_date = r.rate_date AND o.currency = r.currency WHERE o.order_status = 'completed'
  depends_on:
  - revenue
  - cogs
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - dim_products
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#毛利
- name: gross_margin_rate
  label: 毛利率
  aliases:
  - 毛利率
  - 毛利润率
  - gross_margin
  - 产品利润率
  level: derived
  definition: '毛利占收入的百分比，反映产品盈利效率。

    结果为百分比数值，如 35.2 表示毛利率 35.2%'
  sql_template: SELECT (SUM(o.net_amount * r.rate_to_cny) - SUM((p.material_cost + p.labor_cost) * o.quantity))
    / SUM(o.net_amount * r.rate_to_cny) * 100 AS gross_margin_pct FROM sales_orders o JOIN dim_products p ON o.product_id
    = p.product_id JOIN exchange_rates r ON o.order_date = r.rate_date AND o.currency = r.currency WHERE o.order_status
    = 'completed'
  depends_on:
  - gross_profit
  - revenue
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - dim_products
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#毛利率
- name: total_expense
  label: 期间费用
  aliases:
  - 期间费用
  - 费用
  - 总费用
  - 运营费用
  - 期间费用合计
  level: atomic
  definition: '企业日常经营的四大费用汇总：研发费用 + 销售费用 + 管理费用 + 财务费用。注意 selling_expense 已包含其子项（marketing/logistics/warranty），不可重复计算。

    selling_expense 是总项，包含 marketing_expense + logistics_expense + warranty_expense，汇总时只用总项'
  sql_template: SELECT SUM(rd_expense + selling_expense + admin_expense + finance_expense) AS total_expense FROM
    finance_expenses
  depends_on: []
  time_field: expense_date
  filters: []
  source_tables:
  - finance_expenses
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#期间费用
- name: profit
  label: 利润
  aliases:
  - 利润
  - 净利润
  - 经营利润
  - profit
  - 营业利润
  level: composite
  definition: '企业经营利润 = 毛利 - 期间费用。需要跨两个数据源计算：订单相关（毛利）和费用表（期间费用）。

    利润计算涉及两个独立数据源，无法单一 SQL 完成，需分步计算后合并'
  sql_template: null
  depends_on:
  - gross_profit
  - total_expense
  time_field: null
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - dim_products
  - exchange_rates
  - finance_expenses
  requires_multi_step: true
  provenance: chatbi_mvp:indicators_full.json#利润
- name: avg_order_value
  label: 客单价
  aliases:
  - 客单价
  - 平均订单金额
  - 单均收入
  - ARPO
  level: derived
  definition: '每笔已完成订单的平均收入金额（人民币）。

    分母用 COUNT(DISTINCT order_id) 确保不重复计数'
  sql_template: SELECT SUM(o.net_amount * r.rate_to_cny) / COUNT(DISTINCT o.order_id) AS avg_order_value FROM sales_orders
    o JOIN exchange_rates r ON o.order_date = r.rate_date AND o.currency = r.currency WHERE o.order_status = 'completed'
  depends_on:
  - revenue
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#客单价
- name: order_count
  label: 订单量
  aliases:
  - 订单量
  - 订单数
  - 订单总数
  - 成交订单数
  level: atomic
  definition: '已完成订单的数量。

    必须过滤 completed 状态，排除 cancelled 和 pending'
  sql_template: SELECT COUNT(*) AS order_count FROM sales_orders WHERE order_status = 'completed'
  depends_on: []
  time_field: order_date
  filters:
  - order_status = 'completed'
  source_tables:
  - sales_orders
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#订单量
- name: rd_expense_ratio
  label: 研发费用率
  aliases:
  - 研发费用率
  - 研发投入比
  - R&D费用率
  - 研发占比
  level: derived
  definition: '研发费用占总收入的百分比，反映企业研发投入强度。新能源企业通常在 8-15%。

    跨数据源指标，需确保时间范围对齐'
  sql_template: null
  depends_on:
  - revenue
  time_field: null
  filters: []
  source_tables:
  - finance_expenses
  - sales_orders
  - exchange_rates
  requires_multi_step: true
  provenance: chatbi_mvp:indicators_full.json#研发费用率
- name: selling_expense_ratio
  label: 销售费用率
  aliases:
  - 销售费用率
  - 销售费用占比
  - selling_expense_ratio
  level: derived
  definition: '销售费用占总收入的百分比。

    selling_expense 是总项，已包含市场/物流/质保三个子项'
  sql_template: null
  depends_on:
  - revenue
  time_field: null
  filters: []
  source_tables:
  - finance_expenses
  - sales_orders
  - exchange_rates
  requires_multi_step: true
  provenance: chatbi_mvp:indicators_full.json#销售费用率
- name: product_line_revenue
  label: 产品线收入
  aliases:
  - 产品线收入
  - 按产品线收入
  - 各产品线收入
  - 分产品线营收
  level: derived
  definition: '按产品线维度汇总的不含税收入。需要 JOIN 产品维度表获取 product_line 字段。

    product_line 枚举值：动力电池-乘用车 / 动力电池-商用车 / 储能系统-电网级 / 储能系统-工商业 / 电池材料与回收'
  sql_template: SELECT p.product_line, SUM(o.net_amount * r.rate_to_cny) AS revenue FROM sales_orders o JOIN dim_products
    p ON o.product_id = p.product_id JOIN exchange_rates r ON o.order_date = r.rate_date AND o.currency = r.currency
    WHERE o.order_status = 'completed' GROUP BY p.product_line
  depends_on:
  - revenue
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - dim_products
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#产品线收入
- name: region_revenue
  label: 区域收入
  aliases:
  - 区域收入
  - 按区域收入
  - 各大区收入
  - 分区域营收
  - 市场收入
  level: derived
  definition: '按销售大区维度汇总的不含税收入。可直接用 sales_orders.region 字段，无需 JOIN 客户表。

    region 是冗余字段，可直接从 sales_orders 取，无需 JOIN dim_customers'
  sql_template: SELECT o.region, SUM(o.net_amount * r.rate_to_cny) AS revenue FROM sales_orders o JOIN exchange_rates
    r ON o.order_date = r.rate_date AND o.currency = r.currency WHERE o.order_status = 'completed' GROUP BY o.region
  depends_on:
  - revenue
  time_field: sales_orders.order_date
  filters:
  - o.order_status = 'completed'
  source_tables:
  - sales_orders
  - exchange_rates
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#区域收入
- name: total_quantity
  label: 销量
  aliases:
  - 销量
  - 出货量
  - 销售数量
  - 总销量
  level: atomic
  definition: '已完成订单的产品数量汇总（单位：MWh 或套数）。

    单位取决于产品类型，动力电池通常用 MWh，储能系统用套'
  sql_template: SELECT SUM(quantity) AS total_quantity FROM sales_orders WHERE order_status = 'completed'
  depends_on: []
  time_field: order_date
  filters:
  - order_status = 'completed'
  source_tables:
  - sales_orders
  requires_multi_step: false
  provenance: chatbi_mvp:indicators_full.json#销量
